# 🥵 Goober's goon tear (goon juice vith homemade special sauce dlc) rules 🥵
windowrule = match:class = .*\.exe, immediate on

windowrule = match:class = (steam_app)455, immediate on

windowrule = match:title = ^(neko)$, immediate on


######## 🥵 Goober's goon layer rules 🥵 ########
# layerrule = xray 1, .*
# layerrule = noanim, .*
layerrule = match:namespace = walker, no_anim on

layerrule = match:namespace = selection, no_anim on

layerrule = match:namespace = overview, no_anim on

layerrule = match:namespace = anyrun, no_anim on

layerrule = match:namespace = popup.*, no_anim on

layerrule = match:namespace = hyprpicker, no_anim on

layerrule = match:namespace = noanim, no_anim on

layerrule {
  name = GTK4 Layer Shell
  match:namespace = gtk4-layer-shell
  blur = on
  ignore_alpha = 0
}

layerrule {
  name = Applauncher
  match:namespace = launcher
  blur = on
  ignore_alpha = 0.5
}

layerrule = match:namespace = quickshell:screenCorners, animation popin 120%

layerrule = match:namespace = quickshell:notificationPopup, animation fade

layerrule {
  name = Notifications
  match:namespace = notifications
  blur = on
  ignore_alpha = 0.69
}