# Lines ending with `# [hidden]` won't be shown on cheatsheet
# Lines starting with #! are section headings

# a$$hole
$BROWSER=env firefox
$TERMINAL=kitty &&! kitty --config=NONE &&! foot &&! xterm
$FILE_MANAGER=nautilus
$TEXT_EDITOR=code
$APPLAUNCHER=qs ipc call launcher toggle
$EMOJI=qs ipc call emoji toggle
$SS=grim -g "$(slurp)" - | wl-copy --type image/png
$SSButFullScreen=grim - | wl-copy --type image/png

#!
##! Shell bestie 💚🦕
bind = Super Ctrl, R, exec, pw-play ~/.config/hypr/sfx/yoshi-pam.mp3 & # [hidden]
bind = Super Ctrl, R, exec, pkill qs;pkill quickshell;env qs & # Maybe restart quickshell
bind = Super Ctrl, R, exec, env qs -p ~/.config/quickshell/shell2.qml &  # [hidden]
bind = Super Ctrl, R, exec, env qs -p ~/.config/quickshell/lockShell.qml & # [hidden]
bind = Super, B, exec, pw-play ~/.config/hypr/sfx/yoshi-tongue.mp3 & # [hidden]
bind = Super, Super_L, exec, $APPLAUNCHER & # open the applauncher thats not touched since oct
bind = Super, Period, exec, $EMOJI & # open the ABSOLUTELY LEGENDARY emoji picker
bind = Super Shift Ctrl, Period, exec, qs ipc call DihAi triggerDih & # open the pu sending ai vindov
bindt = Super, S, exec, qs -p ~/.config/quickshell/shell2.qml ipc call settings toggle # toggle the unhinged settings menu 💚🦕
bind = Super Shift, L, exec, qs -p ~/.config/quickshell/lockShell.qml ipc call lock activate # toggle the baby oiled lock
bind = Super, Escape, exec, qs ipc call session toggle # toggle the pause buffer menu
bind = Super, Slash, exec, qs ipc call cheatsheet toggle # toggle ts
bind = Super, Slash, exec, pw-play ~/.config/hypr/sfx/yoshi-waaah.mp3 & # [hidden] 

