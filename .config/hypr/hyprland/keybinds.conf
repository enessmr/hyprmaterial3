bind = Super SHIFT, Down, resizeactive, 0 100 # make the active get a half but quarter super rotten mushroom
bind = Super SHIFT, Down, exec, pw-play ~/.config/hypr/sfx/yoshi-yap.mp3 & # [hidden]
